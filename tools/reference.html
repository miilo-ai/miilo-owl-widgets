<!doctype html><meta charset="utf-8"><title>Evaluated OWL reference</title>
<style>
*{box-sizing:border-box;min-width:0}body{background:#eee9e4;margin:24px;font-family:monospace;color:#302a35}h1{font:13px monospace}main{display:grid;grid-template-columns:repeat(3,360px);gap:22px}.reference-label{font-size:11px;margin:10px 0}.tile{width:180px;height:180px;overflow:hidden;padding:8px;border-radius:12px}.tile.short{height:120px}.screen{width:360px;padding:16px;margin-top:12px;border-radius:12px;overflow:hidden}.dark{background:#16151d;color:#eeeaf4}.light{background:#faf5ee;color:#28232e}canvas{display:block}.owl-text{overflow:hidden;text-overflow:ellipsis}
</style><h1>Actual evaluated OWL · layout reference · native owl-check still required</h1><main></main>
<script>
const data=/*DATA*/;
const color=v=>typeof v==='string'&&v.startsWith('#')&&v.length===9?'#'+v.slice(3)+v.slice(1,3):v;
function node(n){const p=n.props||{},el=document.createElement(n.kind==='Canvas'?'canvas':n.kind==='Button'?'button':'div');
if(p.weight)el.style.flex=p.weight+' 1 0';if(p.width!=null){el.style.width=p.width+'px';el.style.flexShrink='0';}if(p.height!=null)el.style.height=p.height+'px';if(p.fill==='width')el.style.width='100%';
if(p.padding)el.style.padding=Array.isArray(p.padding)?p.padding.map(v=>v+'px').join(' '):p.padding+'px';if(p.background)el.style.background=color(p.background);if(p.radius)el.style.borderRadius=p.radius+'px';
if(['Column','Row','Flow'].includes(n.kind)){el.style.display='flex';el.style.flexDirection=n.kind==='Column'?'column':'row';el.style.gap=(p.gap||0)+'px';if(n.kind==='Flow')el.style.flexWrap='wrap';if(p.align==='center')el.style.alignItems='center';}
if(['Text','Button'].includes(n.kind)){el.className='owl-text';el.textContent=p.text;el.style.fontSize=(p.fontSize||(['small','label'].includes(p.style)?11:13))+'px';el.style.lineHeight='1.25';if(p.color)el.style.color=color(p.color);if(p.maxLines===1)el.style.whiteSpace='nowrap';if(p.maxLines>1){el.style.display='-webkit-box';el.style.webkitLineClamp=p.maxLines;el.style.webkitBoxOrient='vertical';}if(p.align==='end')el.style.textAlign='right';if(n.kind==='Button'){el.style.background='transparent';el.style.color='inherit';el.style.border='1px solid currentColor';el.style.borderRadius='5px';el.style.padding='4px 6px';el.style.fontFamily='inherit';}}
if(n.kind==='Canvas'){el._draw=n.children;el._width=p._drawWidth;}else for(const c of n.children||[])el.append(node(c));return el;}
for(const item of data){const section=document.createElement('section');const label=document.createElement('div');label.className='reference-label';label.textContent=item.name+' · '+item.theme;section.append(label);const tile=document.createElement('div');tile.className='tile '+item.theme+(item.name.startsWith('70')?'':' short');tile.style.width=item.width+'px';tile.style.height=item.height+'px';item.tile.forEach(n=>tile.append(node(n)));section.append(tile);const screen=document.createElement('div');screen.className='screen '+item.theme;item.screen.forEach(n=>screen.append(node(n)));section.append(screen);document.querySelector('main').append(section);}
requestAnimationFrame(()=>{for(const el of document.querySelectorAll('canvas')){const r=el.getBoundingClientRect();el.width=r.width*2;el.height=r.height*2;const ctx=el.getContext('2d');ctx.scale(2,2);ctx.scale(r.width/(el._width||r.width),1);for(const d of el._draw||[]){const a=d.args||[],p=d.named||{};ctx.fillStyle=color(p.fill||'#00000000');ctx.strokeStyle=color(p.stroke||'#00000000');ctx.lineWidth=p.width||1;ctx.lineCap=p.cap||'butt';ctx.beginPath();if(d.op==='circle')ctx.arc(a[0],a[1],a[2],0,Math.PI*2);if(d.op==='rect')ctx.roundRect(a[0],a[1],a[2],a[3],p.radius||0);if(d.op==='line'){ctx.moveTo(a[0],a[1]);ctx.lineTo(a[2],a[3]);}if(d.op==='path')a[0].forEach((xy,i)=>i?ctx.lineTo(xy[0],xy[1]):ctx.moveTo(xy[0],xy[1]));if(d.op==='text'){ctx.fillStyle=color(p.color);ctx.font=(p.size||10)+'px monospace';ctx.fillText(a[0],a[1],a[2]+3);}if(p.fill)ctx.fill();if(p.stroke)ctx.stroke();}}});
</script>
