name: Widget helper tests
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      with:
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        workspaces: helper
    - run: cargo fmt --manifest-path helper/Cargo.toml --check
    - run: cargo clippy --locked --manifest-path helper/Cargo.toml --all-targets -- -D warnings
    - run: make test
    - run: bash -n install.sh tools/check-device.sh tools/build-linux.sh tools/package.sh
    - run: python3 tools/assemble.py && git diff --exit-code -- '*.owl'
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - run: make build-linux
    - name: Run native ARM64 tests and compiled CLI journeys
      run: |
        docker run --rm --platform linux/arm64 -v "$PWD:/repo" -w /repo \
          -v miilo-owl-cargo:/usr/local/cargo/registry \
          -e CARGO_TARGET_DIR=/repo/helper/target-linux miilo-owl-builder:1.3 \
          bash -c 'cargo test --locked --manifest-path helper/Cargo.toml --target aarch64-unknown-linux-musl -j 2 && MIILO_OWL_BINARY=/repo/helper/target/aarch64-unknown-linux-musl/release/miilo-owl python3 -m unittest discover -s tests -v'
    - run: make package
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: miilo-owl-widgets-linux-aarch64
        path: dist/*
'on':
- push
- pull_request
