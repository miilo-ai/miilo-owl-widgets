name: Widget helper tests
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: ./.github/actions/sdk-access
      id: sdk
      with: &id001
        token: ${{ github.event_name != 'pull_request' && (secrets.MIILO_SDK_READ_TOKEN
          || secrets.MIILO_WORKSPACE_READ_TOKEN) || '' }}
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      with:
        toolchain: 1.96.1
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        workspaces: helper
    - run: cargo fmt --manifest-path helper/Cargo.toml --check
    - run: cargo clippy --locked --manifest-path helper/Cargo.toml --all-targets --
        -D warnings
      if: steps.sdk.outputs.ready == 'true'
    - run: make test
      if: steps.sdk.outputs.ready == 'true'
    - run: make check-desktop
      if: steps.sdk.outputs.ready == 'true'
    - run: cargo fmt --manifest-path xtask/Cargo.toml --check
    - run: cargo clippy --locked --manifest-path xtask/Cargo.toml --all-targets --
        -D warnings
      if: steps.sdk.outputs.ready == 'true'
    - run: bash -n install.sh tools/check-device.sh tools/build-linux.sh tools/package.sh
    - run: cargo xtask assemble && git diff --exit-code -- '*.owl'
      if: steps.sdk.outputs.ready == 'true'
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: ./.github/actions/sdk-access
      id: sdk
      with: *id001
    - run: make build-linux
      if: steps.sdk.outputs.ready == 'true'
    - name: Run native ARM64 tests and compiled CLI journeys
      run: tools/test-linux.sh
      if: steps.sdk.outputs.ready == 'true'
    - run: make package
      if: steps.sdk.outputs.ready == 'true'
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: miilo-owl-widgets-linux-aarch64
        path: dist/*
      if: steps.sdk.outputs.ready == 'true'
'on':
- push
- pull_request
