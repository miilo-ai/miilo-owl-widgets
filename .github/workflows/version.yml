name: Version and tag
'on':
  push:
    branches:
    - main
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: false
        description: Manually authorize tagging and release dispatch; main version bumps release automatically
permissions:
  contents: read
concurrency:
  group: version-main
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      new: ${{ steps.version.outputs.new_version }}
      publish: ${{ steps.policy.outputs.publish }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: ./.github/actions/sdk-access
      id: sdk
      with:
        token: ${{ github.event_name != 'pull_request' && (secrets.MIILO_SDK_READ_TOKEN
          || secrets.MIILO_WORKSPACE_READ_TOKEN) || '' }}
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      with:
        toolchain: 1.96.1
    - run: cargo xtask release version
      id: version
      if: steps.sdk.outputs.ready == 'true'
    - id: policy
      run: cargo xtask release publication
      env:
        MIILO_RELEASE_ENABLED: ${{ vars.MIILO_RELEASE_ENABLED }}
        MIILO_PUBLISH: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.MIILO_RELEASE_ENABLED != 'false') || inputs.publish == true }}
        RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DEPENDENCIES_READY: 'true'
      if: steps.sdk.outputs.ready == 'true'
  qualify:
    needs: candidate
    if: needs.candidate.outputs.publish == 'true' && needs.candidate.outputs.new ==
      'true'
    uses: ./.github/workflows/qualify.yml
    secrets: inherit
  tag:
    needs:
    - candidate
    - qualify
    if: needs.qualify.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    environment: release
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ github.sha }}
    - name: Create matching tag and explicitly dispatch release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ needs.candidate.outputs.tag }}
      run: "set -euo pipefail\ngit config user.name \"github-actions[bot]\"\ngit config\
        \ user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\ngh\
        \ auth setup-git\nif git show-ref --verify --quiet \"refs/tags/$TAG\"; then\n\
        \  test \"$(git rev-parse \"$TAG^{commit}\")\" = \"$GITHUB_SHA\"\nelse\n \
        \ git tag -a \"$TAG\" -m \"Release $TAG\" \"$GITHUB_SHA\"\n  git push origin\
        \ \"$TAG\"\nfi\ngh workflow run release.yml --ref \"$TAG\" -f tag=\"$TAG\"\
        \ -f publish=true"
  unchanged:
    needs:
    - candidate
    - qualify
    - tag
    if: always() && needs.tag.result != 'success'
    runs-on: ubuntu-latest
    steps:
    - run: 'echo "No release has been made" >> "$GITHUB_STEP_SUMMARY"

        echo "No release has been made"'
