name: Release widgets
'on':
  push:
    tags:
    - v*
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true
      publish:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  qualify:
    uses: ./.github/workflows/qualify.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
  publication-gate:
    needs: qualify
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.policy.outputs.publish }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ inputs.tag || github.ref }}
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      with:
        toolchain: 1.96.1
    - run: cargo xtask release version --tag "$TAG"
      env:
        TAG: ${{ inputs.tag || github.ref_name }}
    - name: Publishing requires the exact tag workflow context
      if: inputs.publish == true || vars.MIILO_RELEASE_ENABLED == 'true'
      shell: bash
      run: test "$GITHUB_REF" = "refs/tags/$TAG" || { echo "Run the release workflow from its version tag, not another branch"
        >&2; exit 1; }
      env:
        TAG: ${{ inputs.tag || github.ref_name }}
    - id: existing
      run: cargo xtask release release-exists
      env:
        RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
    - id: policy
      run: cargo xtask release publication
      env:
        MIILO_RELEASE_ENABLED: ${{ vars.MIILO_RELEASE_ENABLED }}
        MIILO_PUBLISH: ${{ inputs.publish }}
        RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DEPENDENCIES_READY: ${{ needs.qualify.outputs.ready == 'true' && steps.existing.outputs.exists != 'true' }}
  build:
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ inputs.tag || github.ref }}
        persist-credentials: false
    - run: make build-linux
    - name: Run native ARM64 tests and compiled CLI journeys
      run: |
        docker run --rm --platform linux/arm64 -v "$PWD:/repo" -w /repo \
          -v miilo-owl-cargo:/usr/local/cargo/registry \
          -e CARGO_TARGET_DIR=/repo/helper/target-linux miilo-owl-builder:1.3 \
          bash -c 'cargo test --locked --manifest-path helper/Cargo.toml --target aarch64-unknown-linux-musl -j 2'
    - run: make package
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: miilo-owl-widgets-linux-aarch64
        path: dist/*
    needs:
    - qualify
    - publication-gate
    if: needs.publication-gate.outputs.publish == 'true'
    timeout-minutes: 30
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: miilo-owl-widgets-linux-aarch64
        path: release
    - run: sha256sum -c SHA256SUMS
      working-directory: release
    - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
      if: github.event.repository.private == false
      with:
        subject-path: release/*
    - run: |-
        flags=()
        if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
        gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "${flags[@]}"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ inputs.tag || github.ref_name }}
      shell: bash
  no-release:
    needs:
    - qualify
    - publication-gate
    - publish
    if: always() && needs.publish.result != 'success'
    runs-on: ubuntu-latest
    steps:
    - run: |-
        echo "No release has been made"
        echo "No release has been made" >> "$GITHUB_STEP_SUMMARY"
