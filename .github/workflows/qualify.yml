name: Candidate qualification
'on':
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
    secrets:
      MIILO_SDK_READ_TOKEN:
        required: false
      MIILO_WORKSPACE_READ_TOKEN:
        required: false
    outputs:
      ready:
        value: ${{ jobs.qualify.outputs.ready }}
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: '2'
    outputs:
      ready: ${{ steps.result.outputs.ready }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ inputs.ref || github.sha }}
    - uses: ./.github/actions/sdk-access
      id: sdk
      with:
        token: ${{ github.event_name != 'pull_request' && (secrets.MIILO_SDK_READ_TOKEN
          || secrets.MIILO_WORKSPACE_READ_TOKEN) || '' }}
    - name: Architecture boundary gate
      run: node tools/check-architecture.cjs && node --test tools/architecture.test.cjs && node tools/check-no-python.cjs
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      with:
        toolchain: 1.96.1
        components: rustfmt, clippy
    - run: cargo xtask release lint-workflows
      if: steps.sdk.outputs.ready == 'true'
    - run: cargo test --locked --manifest-path xtask/Cargo.toml -j 2
      if: steps.sdk.outputs.ready == 'true'
    - run: cargo xtask release version --tag "$RELEASE_TAG"
      env:
        RELEASE_TAG: ${{ startsWith(inputs.ref, 'refs/tags/') && inputs.ref || startsWith(inputs.ref,
          'v') && inputs.ref || '' }}
      if: steps.sdk.outputs.ready == 'true'
    - run: 'cargo fmt --manifest-path helper/Cargo.toml --check

        cargo clippy --locked --manifest-path helper/Cargo.toml --all-targets -- -D
        warnings

        make test

        make check-desktop

        cargo fmt --manifest-path xtask/Cargo.toml --check

        cargo clippy --locked --manifest-path xtask/Cargo.toml --all-targets -- -D
        warnings

        cargo xtask assemble

        git diff --exit-code -- "*.owl"

        bash -n install.sh tools/*.sh'
      if: steps.sdk.outputs.ready == 'true'
    - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
      with:
        distribution: temurin
        java-version: '21'
    - name: Compile with pinned official OWL checker
      shell: bash
      env:
        OWL_URL: https://raw.githubusercontent.com/SimonSchubert/omarchy-widgets/34c08fd6a9de020a7a9fcd6f397d493c3351a8fd/tools/owl.jar
        OWL_SHA256: bfc294234f6cc2ab2024271cb6d55b5259513db0647ac8f636c85997b4f5f0cf
      run: 'curl --fail --silent --show-error --location "$OWL_URL" -o "$RUNNER_TEMP/owl.jar"

        printf ''%s  %s\n'' "$OWL_SHA256" "$RUNNER_TEMP/owl.jar" | sha256sum -c -

        for widget in *.owl; do java -jar "$RUNNER_TEMP/owl.jar" check "$widget";
        done'
    - run: echo "ready=$READY" >> "$GITHUB_OUTPUT"
      id: result
      env:
        READY: ${{ steps.sdk.outputs.ready }}
