[package]
name = "miilo-owl"
version = "1.4.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Native observation and revision-bound action helper for Miilo OWL widgets"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fs2 = "0.4"
libc = "0.2"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
url = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
