[package]
name = "miilo-owl"
version = "1.5.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Native observation and revision-bound action helper for Miilo OWL widgets"

[dependencies]
miilo-adapter-sdk = { git = "https://github.com/miilo-ai/miilo-sdk", rev = "40c2008207ae8abac2b82eeca7511ad6bf665d35" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fs2 = "0.4"
libc = "0.2"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip", "brotli", "zstd"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
url = "2"

[dev-dependencies]
miilo-adapter-sdk = { git = "https://github.com/miilo-ai/miilo-sdk", rev = "40c2008207ae8abac2b82eeca7511ad6bf665d35", features = ["compression"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
