[package]
name = "miilo-owl"
version = "1.7.2"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Native observation and revision-bound action helper for Miilo OWL widgets"

[dependencies]
miilo-session-telemetry = { path = "../session-telemetry" }
miilo-pairing = { git = "https://github.com/miilo-ai/miilo-cli", rev = "a710b496148264cb7e8d8d600ea8ab1728775a59" }
miilo-adapter-sdk = { git = "https://github.com/miilo-ai/miilo-sdk", rev = "09d6630d855e0cb0cb69ce7e4508471c1b3a35c9" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fs2 = "0.4"
libc = "0.2"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip", "brotli", "zstd"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
url = "2"

[dev-dependencies]
miilo-adapter-sdk = { git = "https://github.com/miilo-ai/miilo-sdk", rev = "09d6630d855e0cb0cb69ce7e4508471c1b3a35c9", features = ["compression"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
